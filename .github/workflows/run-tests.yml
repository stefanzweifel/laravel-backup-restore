name: run-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.5, 8.4]
        laravel: ["13.*", "12.*"]
        stability: [
            # prefer-lowest,
            prefer-stable,
          ]
        # The constraints below deliberately avoid "^". On Windows, composer is a
        # .bat file, so the command line goes through cmd.exe, which eats "^" as
        # its escape character: "^11.0" arrives as "11.0", an exact-version match.
        # "carbon:^3.8" became "carbon:3.8", which pins 3.8.0 — a release with a
        # security advisory — and the install fails.
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: 3.*
          - laravel: 12.*
            testbench: 10.*
            carbon: 3.*
          # Windows and macOS run one representative combination each: newest PHP,
          # newest Laravel. Running the full matrix on three operating systems
          # would be 12 jobs for little extra signal.
          - os: windows-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            carbon: 3.*
            stability: prefer-stable
          - os: macos-latest
            php: 8.5
            laravel: 13.*
            testbench: 11.*
            carbon: 3.*
            stability: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Service containers only run on Linux runners, so MySQL and PostgreSQL are
      # installed on the runner on all three operating systems instead.
      - name: Setup MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.4"

      - name: Create MySQL database
        run: mysql -uroot -h 127.0.0.1 -e 'CREATE DATABASE IF NOT EXISTS laravel_backup_restore'
        shell: bash

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: root
          password: password
          database: laravel_backup_restore

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_mysql and pdo_pgsql have to be listed explicitly. The Linux PHP
          # packages enable both by default, so the list got away with omitting
          # them until Windows joined the matrix, where setup-php enables only
          # what it is asked for and every database test died with
          # "could not find driver".
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          ini-values: pcov.directory=src
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      # The package shells out to gunzip, bunzip2 and sqlite3. Linux and macOS
      # runners ship all three; Windows ships none of them on PATH. Git for
      # Windows carries gzip and bzip2 in its usr/bin, which is not on PATH by
      # default, and sqlite3 is not on the image at all.
      - name: Install CLI dependencies on Windows
        if: runner.os == 'Windows'
        run: |
          choco install sqlite --yes --no-progress
          "C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\ProgramData\chocolatey\lib\SQLite\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # Resolve each binary the way the tests will, so a future failure names the
      # missing one instead of only saying the import failed. Windows uses pwsh
      # rather than bash here: Git Bash carries its own usr/bin on PATH, so it
      # would find tools that the process running the tests cannot see.
      - name: Show CLI dependencies
        if: runner.os != 'Windows'
        run: |
          for cli in mysql psql sqlite3 gzip gunzip bzip2 bunzip2; do
            echo "$cli -> $(command -v "$cli" || echo 'NOT FOUND')"
          done
        shell: bash

      - name: Show CLI dependencies on Windows
        if: runner.os == 'Windows'
        run: |
          foreach ($cli in 'mysql', 'psql', 'sqlite3', 'gzip', 'gunzip', 'bzip2', 'bunzip2') {
            $found = Get-Command $cli -ErrorAction SilentlyContinue
            "$cli -> $(if ($found) { $found.Source } else { 'NOT FOUND' })"
          }
        shell: pwsh

      # Git Bash is available on the Windows runners, so one bash step covers all
      # three operating systems.
      - name: Create sqlite database
        run: touch database/database.sqlite
        shell: bash

      - name: Execute tests
        if: runner.os == 'Linux'
        run: vendor/bin/pest --coverage --min=70
        env:
          MYSQL_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: laravel_backup_restore
          PGSQL_PORT: 5432
          PGSQL_USERNAME: root
          PGSQL_PASSWORD: password
          PGSQL_DATABASE: laravel_backup_restore

      # Coverage drivers on the Windows runners are slow, so the gate runs on
      # Linux only.
      - name: Execute tests without coverage
        if: runner.os != 'Linux'
        run: vendor/bin/pest
        env:
          MYSQL_PORT: 3306
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: laravel_backup_restore
          PGSQL_PORT: 5432
          PGSQL_USERNAME: root
          PGSQL_PASSWORD: password
          PGSQL_DATABASE: laravel_backup_restore
